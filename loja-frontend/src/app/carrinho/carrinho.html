
<h1 class="titulo">Carrinho</h1>




<div class="produtos">
  @for (item of itens(); track item.produto.id) {
  <div class="card-produto">
    <img [src]="item.produto.foto" [alt]="item.produto.nome">

    <p class="nome">{{ item.produto.nome }}</p>

    <p class="descricao">
      {{ item.produto.descricao }}
    </p>

    <p class="preco">
      R$ {{ item.produto.preco }}
    </p>
        <div>
            <button (click)="diminuir(item.produto.id)">=</button>
            <p>
                Quantidade:{{item.quantidade}}
            </p>
            <button (click)="aumentar(item.produto.id)">+</button>
             
        </div>
     



  </div>
  }

</div>
